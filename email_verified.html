<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified - Clausly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 40px;
        }

        .message {
            font-size: 16px;
            color: #333333;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .button {
            display: inline-block;
            background-color: #071165;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            border: none;
        }

        .secondary-text {
            margin-top: 24px;
            font-size: 13px;
            color: #999999;
        }

        .footer {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid #e5e5e5;
            text-align: center;
        }

        .footer p {
            font-size: 13px;
            color: #999999;
            margin: 4px 0;
        }

        .footer a {
            color: #666666;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 24px;
            }

            .logo {
                font-size: 28px;
            }

            .message {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">Clausly</div>

        <!-- Content -->
        <h1>Email Verified</h1>

        <p class="message">
            Your email has been successfully verified. You can now sign in to your account and start using Clausly.
        </p>

        <!-- Open App Button -->
        <a href="com.clausly.app://login-callback/" class="button" id="openAppBtn">
            Open Clausly App
        </a>

        <p class="secondary-text">
            If the app doesn't open automatically, please open it manually and sign in.
        </p>

        <!-- Footer -->
        <div class="footer">
            <p>Contact us: <a href="mailto:clauslyltd@gmail.com">clauslyltd@gmail.com</a></p>
            <p>© 2025 Clausly. All rights reserved.</p>
        </div>
    </div>

    <script>
        // Auto-redirect after 2 seconds
        setTimeout(function() {
            window.location.href = 'com.clausly.app://login-callback/';
        }, 2000);

        // Handle button click
        document.getElementById('openAppBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = 'com.clausly.app://login-callback/';
            setTimeout(function() {
                alert('Please open the Clausly app manually and sign in.');
            }, 1000);
        });
    </script>
</body>
</html>
